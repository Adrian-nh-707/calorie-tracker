
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | MealMargin</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

    <main>

        <div class="auth-brand">
            <img th:src="@{/images/mealmargin-logo.png}"
                 alt="MealMargin">
        </div>

        <h1>Create your account</h1>
        <p>Start tracking your nutrition with MealMargin.</p>

        <form th:action="@{/register}"
              th:object="${registrationForm}"
              method="post">

            <div class="name-fields">

                <div>
                    <label for="firstName">First name</label>
                    <input type="text"
                           id="firstName"
                           th:field="*{firstName}"
                           placeholder="First name"
                           autocomplete="given-name"
                           required>

                    <p class="error"
                       th:if="${#fields.hasErrors('firstName')}"
                       th:errors="*{firstName}">
                    </p>
                </div>

                <div>
                    <label for="lastName">Last name</label>
                    <input type="text"
                           id="lastName"
                           th:field="*{lastName}"
                           placeholder="Last name"
                           autocomplete="family-name"
                           required>

                    <p class="error"
                       th:if="${#fields.hasErrors('lastName')}"
                       th:errors="*{lastName}">
                    </p>
                </div>

            </div>

            <div>
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>

                <p class="error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="72"
                       required>

                <p class="field-help">
                    Use at least 8 characters.
                </p>

                <p class="error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>
            </div>

            <fieldset class="account-type">

                <legend>Account Type</legend>

                <div class="role-options">

                    <label class="role-option">
                        <input type="radio"
                               th:field="*{role}"
                               value="USER"
                               required>

                        <span>
                            <strong>Regular</strong>
                            <small>
                                Track meals, set nutrition goals and
                                monitor your daily progress.
                            </small>
                        </span>
                    </label>

                    <label class="role-option">
                        <input type="radio"
                               th:field="*{role}"
                               value="TRAINER"
                               required>

                        <span>
                            <strong>Trainer</strong>
                            <small>
                                Monitor client progress, provide feedback
                                and recommend nutrition goals.
                            </small>
                        </span>
                    </label>

                </div>

                <p class="error"
                   th:if="${#fields.hasErrors('role')}"
                   th:errors="*{role}">
                </p>

            </fieldset>

            <button type="submit">Create account</button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a th:href="@{/login}">Log in</a>
        </p>

    </main>

</body>
</html>
