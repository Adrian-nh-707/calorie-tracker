<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Calorie Tracker</title>
</head>
<body>

    <main>
        <h1>Create your Calorie Tracker account</h1>
        <p>Join Calorie Tracker to track your nutrition and goals.</p>

        <form th:action="@{/register}"
              th:object="${registrationForm}"
              method="post">

            <div>
                <label for="firstName">First name</label>
                <input type="text"
                       id="firstName"
                       th:field="*{firstName}"
                       required>
                <p th:if="${#fields.hasErrors('firstName')}"
                   th:errors="*{firstName}"></p>
            </div>

            <div>
                <label for="lastName">Last name</label>
                <input type="text"
                       id="lastName"
                       th:field="*{lastName}"
                       required>
                <p th:if="${#fields.hasErrors('lastName')}"
                   th:errors="*{lastName}"></p>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       required>
                <p th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"></p>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       minlength="8"
                       maxlength="72"
                       required>
                <p th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}"></p>
            </div>

            <div class="form-group">
                <label>Account Type</label>

                <div class="role-options">
                    <label class="role-option">
                        <input type="radio"
                            th:field="*{role}"
                            value="USER"
                            required>
                        <span>
                            <strong>Regular</strong>
                            <small>Track your meals, set personal calorie & goals, and follow your progress on a personalized dashboard.</small>
                        </span>
                    </label>

                    <label class="role-option">
                        <input type="radio"
                            th:field="*{role}"
                            value="TRAINER"
                            required>
                        <span>
                            <strong>Trainer</strong>
                            <small>Guide your clients with feedback and regular check-ins, monitor their nutrition progress, and suggest goal adjustments to keep them on track.</small>
                        </span>
                    </label>
                </div>

                <p class="error"
                th:if="${#fields.hasErrors('role')}"
                th:errors="*{role}"></p>
            </div>

            <button type="submit">Create account</button>
        </form>

        <p>
            Already have an account?
            <a th:href="@{/login}">Log in</a>
        </p>
    </main>

</body>
</html>
