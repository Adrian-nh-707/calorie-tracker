<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Meal</title>
    <link rel="stylesheet" th:href="@{/css/meals.css}">
</head>

<body>

    <div class="container">

        <h1>Edit Meal</h1>
        <p>Update your meal information.</p>

        <section>

            <h2>Meal Information</h2>

            <p th:if="${error}"
               th:text="${error}"
               style="color: red; font-weight: bold;">
            </p>

            <form th:action="@{/meals/update/{id}(id=${meal.id})}"
                  method="post">

                <label for="mealDate">Meal Date</label>
                <input type="date"
                       id="mealDate"
                       name="mealDate"
                       th:value="${meal.mealDate}"
                       required>

                <label for="mealType">Meal Type</label>
                <select id="mealType" name="mealType" required>

                    <option value="Breakfast"
                            th:selected="${meal.mealType == 'Breakfast'}">
                        Breakfast
                    </option>

                    <option value="Lunch"
                            th:selected="${meal.mealType == 'Lunch'}">
                        Lunch
                    </option>

                    <option value="Dinner"
                            th:selected="${meal.mealType == 'Dinner'}">
                        Dinner
                    </option>

                    <option value="Snack"
                            th:selected="${meal.mealType == 'Snack'}">
                        Snack
                    </option>

                </select>

                <label for="name">Meal Name</label>
                <input type="text"
                       id="name"
                       name="name"
                       th:value="${meal.name}"
                       required>

                <div class="nutrition-inputs">

                    <div>
                        <label for="calories">Calories</label>
                        <input type="number"
                               id="calories"
                               name="calories"
                               th:value="${meal.calories}"
                               min="0"
                               step="any"
                               required>
                    </div>

                    <div>
                        <label for="protein">Protein (g)</label>
                        <input type="number"
                               id="protein"
                               name="protein"
                               th:value="${meal.protein}"
                               min="0"
                               step="any"
                               required>
                    </div>

                    <div>
                        <label for="carbs">Carbs (g)</label>
                        <input type="number"
                               id="carbs"
                               name="carbs"
                               th:value="${meal.carbs}"
                               min="0"
                               step="any"
                               required>
                    </div>

                    <div>
                        <label for="fat">Fat (g)</label>
                        <input type="number"
                               id="fat"
                               name="fat"
                               th:value="${meal.fat}"
                               min="0"
                               step="any"
                               required>
                    </div>

                </div>

                <button type="submit">Save Changes</button>

            </form>

            <p>
                <a th:href="@{/meals(date=${meal.mealDate})}">
                    Cancel
                </a>
            </p>

        </section>

    </div>

</body>
</html>
